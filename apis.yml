name: Mountain Protocol
description: 'Mountain Protocol is the issuer of USDM, a regulated, institutional-grade
  yield-bearing stablecoin backed by short-term US Treasury securities that pays daily
  rewards to holders through an ERC20 rebasing token. The company operated a Primary-User
  account platform with a private REST API for depositing and withdrawing USDM and
  USDC, querying account balances, and checking USDC liquidity, alongside on-chain
  proof-of-reserves and a smart-contract security program audited by OpenZeppelin
  with an Immunefi bug bounty. As of 2025 the protocol entered an orderly wind-down:
  the primary market closed on August 22, 2025, redemptions moved to secondary markets,
  and Phase 3 provides on-chain proof-of-reserves so holders can independently verify
  USDM backing. Backed by Multicoin Capital.'
